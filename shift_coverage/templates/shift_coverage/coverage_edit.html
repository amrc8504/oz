{% extends "dashboard/base.html" %}

{% block title %}Edit Coverage Post{% endblock %}

{% block content %}

<div class="container" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h2 class="fw-bold mb-4">Edit Shift Coverage Post</h2>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary">
                    Save Changes
                </button>

                <a href="{% url 'shift_coverage:list' %}" class="btn btn-secondary">
                    Cancel
                </a>
            </form>

        </div>
    </div>
</div>

{% endblock %}
