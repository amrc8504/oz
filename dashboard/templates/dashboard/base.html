{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'dashboard/css/styles.css' %}">
</head>

<body>

    <nav class="navbar bg-white shadow-sm px-4 py-3">
        <a class="navbar-brand fw-bold" href="#">
            <img src="{% static 'dashboard/images/OZ.png' %}" alt="Logo" height="40">
        </a>

        <div class="rounded-circle bg-primary-subtle border d-flex align-items-center justify-content-center"
             style="width: 64px; height: 64px;">
            PFP
        </div>
    </nav>

    <!-- FULL WIDTH BACKGROUND -->
    <main class="dashboard-wrapper py-5">
        
        <!-- CENTERED CONTENT -->
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>

    </main>

</body>
</html>
